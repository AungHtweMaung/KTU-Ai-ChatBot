; PHP configuration for the public web root.
;
; PHP's stock limits are upload_max_filesize=2M and post_max_size=8M, while the
; application's own rules allow an 8 MB timetable image (max:8192). A file over
; post_max_size is discarded by PHP before Laravel boots, so the request dies
; with a bare "413 Content Too Large" page and no validation message.
;
; PHP-FPM and CGI read this file per directory. Apache with mod_php ignores it
; and uses the php_value block in .htaccess instead. nginx also needs its own
; client_max_body_size raised to at least 14m — that one cannot be set from
; inside the application.

upload_max_filesize = 12M
post_max_size = 14M

memory_limit = 256M
max_execution_time = 120
max_input_time = 120

; When the body is over post_max_size PHP emits its own warning during request
; startup — before Laravel can do anything — and with display_errors on that
; warning is prepended to the response body. That corrupts the JSON an Inertia
; request receives, so the browser cannot parse the 413 page we send back.
; Laravel still reports errors through its own handler and storage/logs.
display_errors = Off
log_errors = On
